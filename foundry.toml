# Solidity-level correctness (`preview -> checkBefore -> execute -> validate`
# atomicity, freeze/unwind state transitions) still lives on Hardhat 3 / node:test
# (contracts/test-js). Foundry here is for property-based coverage node:test can't
# express cheaply: fuzzing order sequences and running stateful invariants against
# the real Vault/RiskGuard/Adapter contracts (contracts/test).
[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["node_modules", "contracts/lib"]
solc_version = "0.8.37"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Only the Foundry test handlers need this (RegistryHandler.sol hits "stack too
# deep" without it); the production path is still compiled separately by
# contracts/tools/compile.mjs for the Hardhat suite and the web demo, so this
# does not change what actually ships.
via_ir = true
remappings = [
    "forge-std/=contracts/lib/forge-std/src/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 32
fail_on_revert = false

